services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: parcel_system
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6767:80"
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      APP_URL: http://localhost:6767
      WEBROOT: /var/www/html/public
      PHP_CATCHALL: '1'
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: parcel_system
      DB_USERNAME: root
      DB_PASSWORD: secret
      SKIP_COMPOSER: 1
      PHP_ERRORS_STDERR: 1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html

volumes:
  db_data:
